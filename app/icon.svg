<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#2dd4bf" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#090e17" />
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#mintGrad)" stroke-width="2.5" stroke-opacity="0.8" />

  <!-- Monogram DA -->
  <text x="32" y="42" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="900" fill="url(#mintGrad)" text-anchor="middle" letter-spacing="-1">DA</text>

  <!-- AI Neural Node Accent -->
  <circle cx="50" cy="50" r="4.5" fill="#5eead4" filter="url(#glow)"/>
</svg>
